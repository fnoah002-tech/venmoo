<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Minimum Age 21+</title>
  <link rel="icon" href="data:," >
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#050505;--card:#101010;--line:#252525;--text:#fff;--muted:#9a9a9a;--red:#ff5d5d;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(255,93,93,.13),transparent 33%),linear-gradient(180deg,#080808,#000)}
    .page{width:100%;max-width:380px;text-align:center;animation:fade .35s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .lock{width:78px;height:78px;border-radius:24px;margin:0 auto 24px;display:grid;place-items:center;background:linear-gradient(180deg,#181818,#0d0d0d);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35)}
    .lock svg{width:38px;height:38px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:clamp(28px,8vw,38px);line-height:1;font-weight:950;letter-spacing:-.04em;text-transform:uppercase;margin-bottom:12px}
    p{font-size:15px;line-height:1.55;color:var(--muted);margin-bottom:20px}
    .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px 18px;color:#d5d5d5;font-size:13.5px;line-height:1.5;margin-top:18px}
  </style>
</head>
<body>
  <main class="page">
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/></svg>
    </div>
    <h1>Minimum Age: 21+</h1>
    <p>This offer is only available to users aged 21 or older.</p>
    <div class="box">Access has been blocked on this browser because “under 21” was selected.</div>
  </main>

  <script>
    localStorage.setItem('age_blocked_21','1');
    localStorage.removeItem('age_verified_21');
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function(){ history.pushState(null, '', location.href); });
  </script>
</body>
</html>/
